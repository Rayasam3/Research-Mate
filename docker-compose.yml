# Phase 0/1 note: neither the FastAPI backend nor the React frontend need
# Docker to run locally - see docs/setup.md for the plain venv/npm flow.
#
# neo4j (Phase 5) and redis (Phase 8) are active services below.
# ollama (Phase 3) is commented out since this project defaults to Groq -
# uncomment if you switch LLM_PROVIDER=ollama and prefer it containerized
# rather than installed natively.

version: "3.9"

services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/change-me
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

#   ollama:
#     image: ollama/ollama:latest
#     ports:
#       - "11434:11434"
#     volumes:
#       - ollama_data:/root/.ollama

volumes:
  neo4j_data:
  redis_data:
#   ollama_data:
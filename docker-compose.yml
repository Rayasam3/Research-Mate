services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://rm_admin:RmSecurePass2026@postgres:5432/research_mate_users
    volumes:
      - backend_data:/app/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: rm_admin
      POSTGRES_PASSWORD: RmSecurePass2026
      POSTGRES_DB: research_mate_users
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  backend_data:
  postgres_data:
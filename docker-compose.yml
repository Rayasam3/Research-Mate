# Phase 0/1 note: neither the FastAPI backend nor the React frontend need
# Docker to run locally — see docs/setup.md for the plain venv/npm flow.
#
# Uncomment additional services as you reach the phase that needs them:
#   - redis:  Phase 4 (Celery job queue) and Phase 8 (search caching)
#   - ollama: Phase 3 (LLM summary generation) — not used if you're on Groq
#
# neo4j is active now for Phase 5 (knowledge graph).

version: "3.9"

services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/research123
    volumes:
      - neo4j_data:/data
#
